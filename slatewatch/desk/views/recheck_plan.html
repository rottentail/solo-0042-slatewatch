<div class="recheck-plan">
  <header class="striphead"><div><p>前版候选 $before_span · 旧窗 $window_us 毫秒 · 门槛 $threshold‰</p><h3>待核销旧窗</h3></div></header>
  <p class="muted">这是前版异常自己记录的测量窗。确认要核销后，将在后版 <code>$scan</code> 的伴音 $channel 上逐窗实测（$after_note）。</p>
  <div class="table-wrap"><table><thead><tr><th scope="col">窗</th><th scope="col">旧窗节目时标</th><th scope="col">沿用规则</th></tr></thead>
  <tbody>$windows</tbody></table></div>
  <form method="post" action="/desk/scans/$scan/recheck" class="actions">
    <input name="before" value="$before" type="hidden">
    <input name="hit" value="$hit" type="hidden">
    <input name="after_channel" value="$channel" type="hidden">
    <label>复听人<input name="reviewer" required maxlength="120"></label>
    <label>核销说明<input name="reason" required maxlength="350"></label>
    <button class="primary">在后版实测伴音上核销 $count 窗</button>
  </form>
  <p class="muted">核销只记录逐窗证据，不改动前版候选、也不自动销单。</p>
</div>
