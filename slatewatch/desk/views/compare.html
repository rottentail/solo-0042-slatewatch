  <label>后版扫描<select name="after" required><option value="">选择扫描</option>$right</select></label>

<div class="table-wrap"><table><thead><tr><th scope="col">归属</th><th scope="col">异常</th><th scope="col">前版节目时标</th><th scope="col">后版节目时标</th></tr></thead>
<tbody>$rows</tbody></table></div></div>
