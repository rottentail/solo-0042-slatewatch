<div class="wrap"><header class="striphead"><h1>版次比对</h1></header>
<form method="get" action="/desk/compare" class="actions">
  <label>前版扫描<select name="before" required><option value="">选择扫描</option>$left</select></label>
  <label>后版扫描<select name="after" required><option value="">选择扫描</option>$right</select></label>
  <button class="primary">比对</button>
</form>
<p class="muted">对照仍按原有规则返回候选；后版未报候选不代表前版问题已修好。前版独有候选可进入后版的逐窗核销。</p>
<div class="table-wrap"><table><thead><tr><th scope="col">归属</th><th scope="col">异常</th><th scope="col">前版节目时标</th><th scope="col">后版节目时标</th><th scope="col">逐窗核销</th></tr></thead>
<tbody>$rows</tbody></table></div></div>
