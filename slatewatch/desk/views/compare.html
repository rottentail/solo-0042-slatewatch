<div class="wrap"><header class="striphead"><h1>版次比对</h1></header>
<form method="get" action="/desk/compare" class="actions">
  <label>前版扫描<select name="before" required><option value="">选择扫描</option>$left</select></label>
  <label>后版扫描<select name="after" required><option value="">选择扫描</option>$right</select></label>
  <button class="primary">共享时线比对</button>
</form>
<section class="form-section">
  <h2>剪接对照（确认点）</h2>
  <p class="muted">每行一个已确认的同一真实画格：前版时刻、后版时刻（整数微秒），可选名称与证据。留空则沿用上方共享时线的旧比较。确认点不要求落在切口上，但被删内容两侧需各有确认点。</p>
  <form method="post" action="/desk/compare/splice" class="actions splice-form">
    <input type="hidden" name="before" value="$before_id">
    <input type="hidden" name="after" value="$after_id">
    <label class="wide">确认点（每行：前版微秒, 后版微秒, 名称, 证据）
      <textarea name="points" rows="6" placeholder="120000, 120000, 片头后确认, 工单 CC-1&#10;1920000, 1280000, 切口后确认, 工单 CC-4"></textarea>
    </label>
    <button class="primary">按确认点开展剪接对照</button>
  </form>
</section>
$body
</div>
