<div class="workspace">
  $sidebar
  <article class="review">
    <header class="striphead"><div><p>当前扫描 · $source</p><h1>$master</h1></div>$state</header>
    <p class="muted rule">规则 · $policy</p>
    <section aria-label="节目时间轴">$clip</section>
    <section aria-labelledby="results">
      <h2 id="results">技术候选</h2>
      <form method="post" action="/desk/scans/$scan/preview">
        <div class="table-wrap"><table><thead><tr><th scope="col">选择</th><th scope="col">异常</th><th scope="col">轨道</th><th scope="col">节目时标</th><th scope="col">当前结论</th></tr></thead>
        <tbody>$table</tbody></table></div>
        <div class="actions">
          <label>留边（毫秒）<input name="padding_ms" type="number" min="0" max="2000" value="120" required></label>
          <label>画格数<input name="frames" type="number" min="1" max="8" value="3" required></label>
          <button class="primary">同页预览选中候选</button>
          <span class="muted">最多 6 条并排复核；超出在线容量的伴音会标明无法在线播放的范围</span>
        </div>
      </form>
    </section>
    $detail
  </article>
</div>
