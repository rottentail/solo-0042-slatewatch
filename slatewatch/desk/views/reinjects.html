<div class="wrap"><header class="striphead"><div><h1>回灌预检</h1>
<p class="muted">把低码率代理上的待扣留段对回原母带扫描；预检只读，人工确认前不改动任何裁决。</p></div></header>
<section class="form-section">
  <h2>新建预检</h2>
  <form method="post" action="/desk/reinjects" class="actions">
    <label>母带扫描<select name="scan" required><option value="">选择扫描</option>$choices</select></label>
    <label>代理名称<input name="proxy_label" maxlength="120" placeholder="例如：外场代理 A"></label>
    <label>审片员<input name="reviewer" maxlength="120" placeholder="提交人"></label>
    <label>平移容差（微秒）<input name="drift_tolerance_us" type="number" min="0" max="5000000" value="1500000" required></label>
    <p class="muted" style="flex-basis:100%">每条标注一行：<code>类型,起始微秒,结束微秒[,声道][,现场编号]</code>，最多 $max_marks 行；类型取 black、freeze、silence、clip、picture_gap、sound_gap。</p>
    <label style="flex:1 1 100%">代理标注（每行一条）<textarea name="marks" rows="6" required
      placeholder="black,120000,480000&#10;silence,2000000,2400000,1,P-017"></textarea></label>
    <button class="primary">生成预检报告</button>
  </form>
</section>
<section>
  <h2>已有报告</h2>
  <div class="table-wrap"><table><thead><tr><th scope="col">报告编号</th><th scope="col">扫描</th>
  <th scope="col">代理</th><th scope="col">建议</th><th scope="col">冲突</th><th scope="col">无法证明</th></tr></thead>
  <tbody>$rows</tbody></table></div>
</section></div>
